name: anime_episode_alert
description: "An anime episode alert app that notifies users when new episodes are released"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.1.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core dependencies
  cupertino_icons: ^1.0.6
  
  # State Management
  provider: ^6.1.1
  get: ^4.6.6
  
  # Networking
  http: ^1.1.2
  dio: ^5.4.0
  
  # Firebase & Notifications
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  firebase_auth: ^4.15.3
  firebase_firestore: ^4.13.6
  firebase_analytics: ^10.7.4
  google_sign_in: ^6.2.1
  
  # Local Notifications
  flutter_local_notifications: ^16.3.2
  
  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI Components
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^2.7.0
  flutter_staggered_animations: ^1.1.1
  pull_to_refresh: ^2.0.0
  
  # Calendar & Time
  table_calendar: ^3.0.9
  intl: ^0.18.1
  timezone: ^0.9.2
  
  # URL Launcher
  url_launcher: ^6.2.2
  
  # Share functionality
  share_plus: ^7.2.2
  
  # Icons
  flutter_svg: ^2.0.9
  
  # Image picker for profile
  image_picker: ^1.0.4
  
  # Permission handling
  permission_handler: ^11.1.0
  
  # Connectivity
  connectivity_plus: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700